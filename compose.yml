services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: kotlin-product-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: ProductDb_2026_Secure
    ports:
      - "5433:5432"
    volumes:
      - product_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d productdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  product_postgres_data:


